## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf: ">=5.5.0"

  # Since the following components need to be patched, a fixed version is used here
  espressif/esp_lvgl_port: "2.6.0"
  espressif/esp-lib-utils: ^0.3.0
  espressif/esp-boost: ^0.4.1

  # GUI - Animation Player
  espressif2022/image_player:
    version: "1.1.*"
    public: true

  espressif/esp_mmap_assets:
    version: "1.3.*"
    public: true


  echoear:
    override_path: "../common_components/echoear"
